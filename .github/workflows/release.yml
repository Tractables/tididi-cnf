name: Release

# Builds the `tididi` binary, runs it, and packages it with the licence
# notices. For a tag, it then attaches the archive to the GitHub release.
# Creating a release in the GitHub UI pushes the tag, so the release exists by
# the time the tag event arrives here. The manual trigger with a tag rebuilds
# and re-attaches for that tag; without one it builds the selected branch. A
# pull request that changes this workflow or what it runs builds the archive
# without attaching it.
#
# Linux x86-64 only, the platform vitri builds on. The binary loads GMP as a
# shared library, which docs/building.md says.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - .github/scripts/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach the archive to (empty builds the selected branch without attaching)
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
  TARGET: x86_64-unknown-linux-gnu

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Check that the tag and every file naming the version name one
        run: python3 .github/scripts/check-versions.py ${TAG:+"$TAG"}

  linux:
    needs: versions
    # The oldest supported runner image, because the binary requires at least
    # the glibc it was built against.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/install-prereqs

      # `--target` rather than the implied host triple, so the archive name
      # below states what was built.
      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      # A binary that links is not yet known to run. Count a small formula
      # before packaging, so nothing unexecuted is uploaded.
      - name: Smoke test
        run: |
          printf 'p cnf 2 1\n1 2 0\n' > smoke.cnf
          "target/$TARGET/release/tididi" smoke.cnf | grep -qx 'model count: 3'

      # `notices/` holds the licence texts NOTICE names: vitri's and its
      # native stack's, which vitri's own script collects, the diagram
      # library's, and jemalloc's, from the tikv-jemalloc-sys that Cargo.lock
      # pins.
      - name: Package
        run: |
          label=${TAG:-$(git rev-parse --short=12 HEAD)}
          name="tididi-$label-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/tididi" LICENSE NOTICE "dist/$name"
          notices="dist/$name/notices"
          vitri=$(python3 .github/scripts/dependency-path.py vitri)
          tididi=$(python3 .github/scripts/dependency-path.py tididi)
          jemalloc=$(python3 .github/scripts/dependency-path.py tikv-jemalloc-sys)
          bash "$vitri/.github/scripts/collect-notices.sh" "$notices/vitri"
          mkdir -p "$notices/tididi" "$notices/jemalloc"
          cp "$tididi/LICENSE" "$notices/tididi/"
          cp "$jemalloc/jemalloc/COPYING" "$notices/jemalloc/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: tididi-${{ env.TARGET }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # The only job that can write to the repository, and it never runs for a
  # pull request.
  attach:
    needs: linux
    if: github.event_name != 'pull_request' && (inputs.tag != '' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tididi-${{ env.TARGET }}
          path: dist

      # `--clobber` so re-running a job replaces its assets instead of failing
      # on the leftovers of the previous attempt.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/tididi-"$TAG"-"$TARGET".tar.gz dist/tididi-"$TAG"-"$TARGET".tar.gz.sha256 --repo "$GITHUB_REPOSITORY" --clobber
