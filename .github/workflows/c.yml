name: C bindings

# Nightly, on demand, and on a pull request that changes these bindings, what
# they compile or the instances their tests read: each run builds vitri's
# vendored C++ stack twice, for the bindings and for the binary the tests
# compare against, which is more runner time than every commit warrants.
#
# Linux x86_64 only, the platform the crate supports.
on:
  schedule:
    - cron: "30 9 * * *"
  pull_request:
    paths:
      - "bindings/c/**"
      - "bindings/parity.txt"
      - ".github/workflows/c.yml"
      - "src/**"
      - "tests/data/*.cnf"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pinned: cbindgen's output changes between releases, and the header check
  # below compares the committed header against it byte for byte.
  CBINDGEN_VERSION: 0.29.0

jobs:
  c-bindings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/c
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-prereqs
      - name: Cache Cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bindings/c -> target

      # Both libraries, and the tididi binary the tests compare counts with,
      # built from the same checkout. The static link line rustc prints is
      # kept for the check below.
      - name: Build the libraries
        env:
          # The note the link line check reads is plain text only without
          # colour escapes.
          CARGO_TERM_COLOR: never
        run: make libs

      - name: Check the static link line
        run: make link-libs-check

      # The examples and the conformance tests, each linked once against the
      # shared library and once against the static one.
      - name: Build and run the examples and tests
        run: make check

      - name: Test the bindings crate
        run: cargo test --release --locked

      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --release --all-targets --locked -- -D warnings

      # The committed header is what consumers compile against, so a change to
      # src/lib.rs that is not regenerated fails here rather than ship.
      - name: Check the committed header against cbindgen
        if: ${{ !cancelled() }}
        run: |
          cargo install cbindgen --version "$CBINDGEN_VERSION" --locked
          make header-check
