[package]
name = "tididi-cnf"
version = "0.1.0"
edition = "2024"
# The floor let-chains (`if let … && let …`) set for edition 2024, which this
# crate, the tididi library and vitri use.
rust-version = "1.88"
description = "Tree Decision Diagram (TDD) compiler for CNF: compiles a DIMACS formula into a canonical TDD and counts its models — plain, weighted, projected, or projected and weighted."
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi-cnf"
documentation = "https://tractables.github.io/tididi-cnf/tididi_cnf/"
readme = "README.md"
# crates.io caps keywords at 5 entries of 20 characters, hence
# "knowledge-compiler" over the 21-character "knowledge-compilation".
keywords = ["model-counting", "knowledge-compiler", "decision-diagram", "sat", "cnf"]
categories = ["science", "algorithms", "command-line-utilities"]
# Allowlist, not a denylist: `cargo package` ships exactly these files, and a
# file added anywhere else stays out of the package.
# The patterns follow gitignore rules, so a bare file name would match at any
# depth (every `README.md` in the tree); the leading `/` anchors it at the root.
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    # The logo and the figures the README shows.
    "/docs/logo.svg",
    "/docs/evaluation/cactus-2020-2026-dd-compile-120s.svg",
    "/docs/evaluation/cactus-2020-2026-logic-compile-120s.svg",
    "/docs/evaluation/cactus-2020-2026-120s.svg",
    "/docs/evaluation/cactus-3600s.svg",
    "/docs/changelog.md",
    "/LICENSE",
    "/NOTICE",
    # The worked examples' programs.
    "/examples/*.rs",
    # The pages `src/guide.rs` puts into the crate documentation.
    "/docs/examples/*.md",
    "/docs/example-navigation.js",
    "/docs/architecture.md",
    "/docs/library-integration.md",
    # The instances the doctests read.
    "/tests/data/simple.cnf",
    "/tests/data/queens5.cnf",
]

# The package is `tididi-cnf` and its library `tididi_cnf`; the binary is
# `tididi`.
[[bin]]
name = "tididi"
path = "src/main.rs"

[dependencies]
tididi = "0.1.0"
# vitri builds the C++ CaDiCaL and Arjun stack, and takes FlowCutter from the
# goatd crate. The Git source also supplies browser and release build tools
# omitted from its registry package.
vitri = { version = "0.3.0", git = "https://github.com/Tractables/vitri", rev = "2c6bb08ea8db1e499a5b7cd940b9d31aa1aa8338" }
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

# jemalloc is the allocator everywhere but WebAssembly, which has neither
# jemalloc nor an address-space limit for its statistics to watch: there the
# target's own allocator serves, and `src/mem_wasm.rs` stands in for
# `src/mem.rs`.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["stats"] }
tikv-jemalloc-ctl = { version = "0.6", features = ["use_std", "stats"] }
# Raw `mallctlbymib`, for `src/mem.rs`'s `purge_all_arenas`.
tikv-jemalloc-sys = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
# `panic` stays `unwind`, the default, as the Behaviour rules in
# .github/CONTRIBUTING.md require.

# An optimized build that keeps every `debug_assert!` and overflow check live,
# for a bug that only shows on an instance too large for a debug build:
#   cargo build --profile release-checked
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.test]
opt-level = 1

[dev-dependencies]
# The library's oracles and generators (`tididi::test_helpers`) for this
# crate's tests. The library runs its own tests in its repository.
tididi = { version = "0.1.0", features = ["testing"] }
