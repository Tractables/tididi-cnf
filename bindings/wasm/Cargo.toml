[package]
name = "tididi-cnf-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi-cnf"
description = "tididi-cnf built for the browser with Emscripten: a DIMACS CNF goes in, its count and the run's record come out."
publish = false

# An empty workspace table keeps this crate out of the tididi-cnf workspace
# above it, so it is built on its own.
[workspace]

# Emscripten links a program, not a library: a cdylib for this target is a
# side module, which the page cannot load on its own. The binary's `main` does
# nothing and never runs; the page calls the exported functions. The output
# files are named after this binary, so the page loads tididi_cnf.js.
[[bin]]
name = "tididi_cnf"
path = "src/main.rs"

[dependencies]
# The checkout this crate sits in, so a change to the counter is built through
# the page before it is published.
tididi-cnf = { path = "../.." }
serde_json = "1"
# Not called here: vitri's build script hands GMP's side modules to its direct
# dependents only, and build.rs puts them on this program's link line.
vitri = { path = "../../vendor/vitri" }

# This crate's Cargo.lock holds cc at the version vitri's browser build locks:
# the older cc in the repository's Cargo.lock passes em++ -fno-exceptions,
# under which goatd's FlowCutter, which throws and catches, does not compile.

# goatd's main, as the repository's Cargo.toml patches it.
[patch.crates-io]
goatd = { git = "https://github.com/Tractables/goatd", rev = "e237c1afabcf9feb3047bef58efd0113a6005ea7" }
