[package]
name = "tididi-cnf-c"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi-cnf"
description = "C bindings for tididi-cnf: model counting by compiling a CNF into a Tree Decision Diagram."
# Nothing here goes to crates.io; the artifacts are the shared and static
# libraries a C or C++ program links against.
publish = false

# An empty workspace table keeps this crate out of the workspace above it, so
# it is built on its own.
[workspace]

[lib]
name = "tididi_cnf_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# The checkout this crate sits in, so a change to the library is built and
# tested through the bindings. `tididi_cnf_version()` reports this
# package's version, which .github/scripts/check-versions.py keeps equal to
# the library's.
tididi-cnf = { path = "../.." }
# The answer's stats record is serialized with it, as the binary does.
serde_json = "1"
# The library's allocator, jemalloc, uses the initial-exec TLS model by
# default, which a shared library loaded with dlopen (by a language's foreign
# function interface, say) can fail to get room for. This feature switches
# jemalloc to the model a dlopen'ed library may use.
tikv-jemalloc-sys = { version = "0.6", features = ["disable_initial_exec_tls"] }

# goatd's main, as the repository's Cargo.toml patches it.
[patch.crates-io]
goatd = { git = "https://github.com/Tractables/goatd", rev = "e237c1afabcf9feb3047bef58efd0113a6005ea7" }
