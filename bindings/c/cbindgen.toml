language = "C"
include_guard = "TIDIDI_CNF_H"
cpp_compat = true
style = "both"
documentation_style = "doxy"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]

header = """
/* tididi-cnf: model counting by compiling a CNF into a Tree Decision Diagram.
 *
 * Copyright the tididi-cnf authors. Licensed under the Apache License,
 * Version 2.0.
 *
 * Compare TIDIDI_CNF_ABI_VERSION with tididi_cnf_abi_version() at run
 * time to catch a library built from a different ABI than this header.
 */"""

autogen_warning = """
/* Generated from bindings/c/src/lib.rs by cbindgen. Do not edit by hand; CI
 * checks that this file still matches the source. */"""

[parse]
parse_deps = false
