[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "tididi-cnf"
description = "Python bindings for tididi-cnf, a knowledge compiler and model counter for CNF: the model count, the weighted count and their projections of a DIMACS formula, computed by compiling it into a Tree Decision Diagram."
readme = "README.md"
# The extension is built against the stable ABI of 3.10, so one wheel per
# platform serves every version from there on.
requires-python = ">=3.10"
license = "Apache-2.0"
# PEP 639 resolves these against this directory and forbids `..`, so the Python
# workflow copies LICENSE and NOTICE in from the repository root, and
# .github/scripts/collect-notices.sh the texts NOTICE names, before it builds
# the wheel.
license-files = ["notices/**/*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# The version comes from the crate manifest beside this file.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Tractables/tididi-cnf"
Documentation = "https://github.com/Tractables/tididi-cnf/blob/main/bindings/python/README.md"

[tool.maturin]
# The Cargo package is `tididi-cnf-python` to keep it distinct from the
# library it wraps; the module Python imports is `tididi_cnf`.
module-name = "tididi_cnf"
strip = true
