# An empty `[workspace]` table keeps this crate out of the workspace above it,
# so it is built on its own.
[workspace]

[package]
name = "tididi-bonsai-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Tractables/tididi-bonsai"
description = "Python bindings for tididi-bonsai."
publish = false

[lib]
# Python imports the extension by this name, so it matches the `#[pymodule]`
# name and `module-name` in pyproject.toml.
name = "tididi_bonsai"
crate-type = ["cdylib"]

[dependencies]
# The checkout this crate sits in, so a change to the library is built and
# tested through the bindings. `__version__` is this package's version, which
# .github/scripts/check-versions.py keeps equal to the library's.
tididi-bonsai = { path = "../.." }
# `extension-module` links against the interpreter that loads the wheel rather
# than a libpython. `abi3-py310` builds against the stable ABI, so one wheel
# per platform covers CPython 3.10 and later. `num-bigint` and `num-rational`
# hand an exact count to Python as an int or a fractions.Fraction.
pyo3 = { version = "0.29.2", features = ["abi3-py310", "extension-module", "num-bigint", "num-rational"] }
# Exact weights pass from Python to the library as these, which the library
# counts with.
num-bigint = "0.4"
num-rational = "0.4"
# The answer's stats record is serialized with it, as the binary does.
serde_json = "1"
# The library's allocator, jemalloc, uses the initial-exec TLS model by
# default, which an extension module, loaded with dlopen, can fail to get room
# for. This feature switches jemalloc to the model a dlopen'ed library may use.
tikv-jemalloc-sys = { version = "0.6", features = ["disable_initial_exec_tls"] }

# goatd's main, as the repository's Cargo.toml patches it.
[patch.crates-io]
goatd = { git = "https://github.com/Tractables/goatd", rev = "e237c1afabcf9feb3047bef58efd0113a6005ea7" }
